<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>Filmy Juszka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark iOS onboarding look — one narrow column, glass cards on near-black, white pill actions */
:root{
  --bg:#0A0A0B; --lift:#1A1B1F; --card:rgba(255,255,255,.055); --card-solid:#17181B; --stroke:rgba(255,255,255,.10);
  --fg:#F5F5F7; --muted:#8E8E93; --faint:#5A5A60; --pill:#FFFFFF; --pill-fg:#0A0A0B;
  --accent:#FF453A; --green:#30D158; --cta:linear-gradient(90deg,#F3E7CF 0%,#DCE3EA 55%,#BFD3EE 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% 0%,var(--lift) 0%,var(--bg) 60%) var(--bg);color:var(--fg);font-family:var(--font);
  font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
h1{font-weight:700;font-size:clamp(32px,8.5vw,42px);line-height:1.08;margin:0;letter-spacing:-.03em;text-wrap:balance}
h1 .dim{color:var(--faint)}
h2{font-weight:600;font-size:21px;margin:0;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0}
.sub{color:var(--muted);margin-top:10px;font-size:17px;line-height:1.4}
p{margin:0}
section{display:flex;flex-direction:column;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);color:var(--fg)}
.chip.red{background:var(--pill);color:var(--pill-fg);border-color:transparent}
.glass{background:var(--card);border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.say{background:var(--card);border:1px solid var(--stroke);border-radius:20px;padding:16px 18px;font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.015em}
.label{font-size:13px;font-weight:500;color:var(--muted)}
.text-hook{display:inline-block;background:var(--pill);color:var(--pill-fg);font-weight:800;font-size:19px;padding:10px 18px;border-radius:999px;letter-spacing:-.02em}
.note{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:14px 16px;font-size:15px;color:var(--fg)}
.note::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:1px}
ul.plain{margin:0;padding:6px 18px;list-style:none;display:flex;flex-direction:column}
ul.plain li{padding:10px 0;border-bottom:1px solid var(--stroke)}
ul.plain li:last-child{border-bottom:0}
.scheme{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scheme div{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:12px 8px;font-size:13px;font-weight:500;text-align:center;line-height:1.3;color:var(--muted)}
.scheme span{display:block;font-size:22px;font-weight:700;color:var(--fg);margin-bottom:2px}
@media (max-width:480px){.scheme{grid-template-columns:repeat(2,minmax(0,1fr))}.scheme div:last-child:nth-child(odd){grid-column:1/-1}}
ol.items{list-style:none;margin:0;padding:4px 18px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--stroke);border-radius:24px}
ol.items li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--stroke)}
ol.items li:last-child{border-bottom:0}
ol.items .n{font-weight:700;font-size:17px;color:var(--faint);font-variant-numeric:tabular-nums}
ol.items li:last-child .n{color:var(--accent)}
ol.items b{display:block;font-weight:600}
ol.items em{font-style:normal;color:var(--muted);font-size:14px}
.checks{display:flex;flex-direction:column;padding:4px 18px;background:var(--card);border:1px solid var(--stroke);border-radius:24px}
.checks label{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--stroke);cursor:pointer}
.checks label:last-child{border-bottom:0}
.checks input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.checks input:checked{background:var(--green);border-color:var(--green)}
.checks input:checked::after{content:"";width:6px;height:11px;border:solid #0A0A0B;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.count{font-size:14px;color:var(--green);font-weight:600}
/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--stroke);color:var(--fg);text-decoration:none;font-size:20px}
.topbar .t{font-size:15px;font-weight:600;color:var(--muted)}
/* home hero: stacked tilted cards */
.stack{position:relative;height:210px;margin:6px 0 4px}
.stack .c{position:absolute;left:50%;top:50%;width:170px;height:190px;border-radius:28px;background:var(--card-solid);border:1px solid var(--stroke);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.stack .c b{font-size:64px;font-weight:800;line-height:1;letter-spacing:-.04em}
.stack .c span{font-size:13px;color:var(--muted);font-weight:500}
.stack .c1{transform:translate(-118%,-46%) rotate(-12deg);opacity:.45}
.stack .c3{transform:translate(18%,-46%) rotate(12deg);opacity:.45}
.stack .c2{transform:translate(-50%,-52%);z-index:2;background:linear-gradient(180deg,#232428,#17181B)}
.stack .c2::before{content:"";position:absolute;inset:-30px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,69,58,.28),transparent);filter:blur(10px)}
.stack .c2 b{color:var(--fg)}
.films{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.film{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;
  background:var(--card);border:1px solid var(--stroke);text-decoration:none;color:var(--fg)}
a.film:hover{background:rgba(255,255,255,.08)}
.film .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:19px;background:var(--pill);color:var(--pill-fg);font-variant-numeric:tabular-nums}
.film b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.film em{font-style:normal;font-size:13px;color:var(--muted)}
.film .go{height:32px;padding:0 14px;border-radius:999px;display:grid;place-items:center;background:var(--pill);color:var(--pill-fg);font-size:13px;font-weight:600}
.film.locked .num{background:var(--card);color:var(--faint);border:1px solid var(--stroke)}
.film.locked b{color:var(--muted)}
.film .tag{font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
/* chat */
.chat{max-width:560px;margin:0 auto;padding-block:0 48px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.chat-box{background:var(--card);border:1px solid var(--stroke);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.chat-status{font-size:14px;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:2px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px}
.msg .bubble{padding:10px 14px;border-radius:20px;background:#2C2C2E;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg .who{font-size:12px;color:var(--faint)}
.msg .ref{font-size:12px;font-weight:600;color:var(--muted)}
.msg.mine{align-self:flex-end;text-align:right}
.msg.mine .bubble{background:var(--pill);color:var(--pill-fg);text-align:left}
.compose{display:flex;flex-direction:column;gap:10px}
.compose textarea{font:inherit;color:var(--fg);background:rgba(0,0,0,.35);border:1px solid var(--stroke);border-radius:18px;padding:12px 14px;width:100%;box-sizing:border-box;min-height:84px;resize:vertical}
.compose textarea::placeholder{color:var(--faint)}
.compose .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;font-weight:600;background:var(--cta);color:#0A0A0B;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;flex:1 1 auto;max-width:100%}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.film,.btn,.back{transition:transform .2s cubic-bezier(.23,1,.32,1),background .2s}.film:active,.btn:active{transform:scale(.98)}}
</style>

<div class="wrap" id="app"></div>

<section class="chat" aria-labelledby="chat-h">
  <div class="chat-box">
    <h2 id="chat-h">Wiadomości, pytania, poprawki</h2>
    <p class="chat-status" id="chat-status"></p>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="compose" id="compose" hidden>
      <label class="label" for="msg-text">Napisz do Andrzeja</label>
      <textarea id="msg-text" maxlength="2000" placeholder="Wiadomość, pytanie albo poprawka…"></textarea>
      <div class="row"><button class="btn" id="send" type="submit">Wyślij</button><span class="hint" id="send-note"></span></div>
    </form>
  </div>
</section>

<script>
var FILMS=[
  {id:'film-1', n:1, title:'Haul świąteczny z Chin', len:'45–60 s', goal:'Zasięg (TOFU)', ready:true, render:film1},
  {id:'film-2', n:2, title:'Najgorszy outfit z Kako', len:'40–50 s', goal:'Zasięg (TOFU)', ready:true, render:film2},
  {id:'film-3', n:3, title:'„90 % z was nie wie”', goal:'Zaufanie (MOFU)', ready:false},
  {id:'film-4', n:4, title:'Moja pierwsza paczka z Chin', goal:'Zasięg (TOFU)', ready:false},
  {id:'film-5', n:5, title:'Czy to działa? Test z Kako', goal:'Test nowego formatu', ready:false},
  {id:'film-6', n:6, title:'Rozdanie na Discordzie', goal:'Konwersja (BOFU)', ready:false},
  {id:'film-7', n:7, title:'Najlepszy outfit za te same pieniądze', goal:'Zaufanie (MOFU)', ready:false}
];

function home(){
  var ready=FILMS.filter(function(f){return f.ready}).length;
  var h='<div class="stack" aria-hidden="true"><div class="c c1"><b>'+(ready-1>0?ready-1:'')+'</b><span>gotowy</span></div><div class="c c2"><b>'+ready+'</b><span>nowy</span></div><div class="c c3"><b>'+(ready+1)+'</b><span>wkrótce</span></div></div>'+
    '<header><h1>Twoje filmy<br><span class="dim">na ten tydzień.</span></h1><p class="sub">Kliknij film, żeby otworzyć skrypt. Gotowe: '+ready+' z '+FILMS.length+'.</p></header><ul class="films">';
  FILMS.forEach(function(f){
    if(f.ready){
      h+='<li><a class="film" href="#'+f.id+'"><span class="num">'+f.n+'</span><span><b>'+f.title+'</b><em>'+f.len+' · Cel: '+f.goal+'</em></span><span class="go">Otwórz</span></a></li>';
    }else{
      h+='<li><div class="film locked"><span class="num">'+f.n+'</span><span><b>'+f.title+'</b><em>Cel: '+f.goal+'</em></span><span class="tag">wkrótce</span></div></li>';
    }
  });
  return h+'</ul>';
}

function checklist(key, items){
  var h='<section><h2>Lista ujęć <span class="count" data-count></span></h2><div class="checks" data-key="'+key+'">';
  items.forEach(function(t,i){h+='<label><input type="checkbox" id="'+key+'-'+i+'"><span>'+t+'</span></label>'});
  return h+'</div><div class="note">Mów głośno i wyraźnie. Jak pierwsze zdanie wyjdzie niewyraźnie, nagraj je jeszcze raz.</div></section>';
}

function film1(){
  return '<div class="topbar"><a class="back" href="#" aria-label="Wszystkie filmy">←</a><span class="t">Film 1 z 7</span></div>'+
  '<header><h1>Haul świąteczny z Chin</h1><div class="meta"><span class="chip red">Film 1</span><span class="chip">45–60 s</span><span class="chip">Cel: Zasięg (TOFU)</span></div></header>'+
  '<section><h2>Zanim nagrasz</h2><div class="note">Sprawdź ceny tych samych rzeczy w Pepco albo Action i wpisz je zamiast [ ]. Muszą być prawdziwe, ludzie to sprawdzą w komentarzach.</div>'+
  '<p class="label">Co jest w paczce</p><ul class="plain glass"><li>skrzaty pluszowe (2 szt.)</li><li>czerwony skrzat (5 szt.)</li><li>świecący skrzat z lampkami (5 szt.)</li><li>napis LED „Merry Christmas” (2 rodzaje)</li><li>poszewki świąteczne na poduszki (2 szt.)</li><li>lampki LED, gałązka z gwiazdkami na USB (2 szt.)</li><li>koc świąteczny</li></ul></section>'+
  '<section><h2>Hook <small>0–3 s · nagraj wszystkie 3</small></h2>'+
  '<div class="note">Nagrywasz wszystkie 3 początki, reszta filmu jest ta sama. Andrzej robi 3 wersje. Wrzucasz je na Instagrama jako rolki próbne (Trial Reels), po 48 h sprawdzamy, która zatrzymała najwięcej ludzi, i ta idzie na TikToka.</div>'+
  '<p class="label">Wariant A · najtańsze święta</p><div class="say">„Najtańsze święta w moim życiu kosztowały [Y] zł.”</div>'+
  '<div><span class="text-hook">Święta z Chin: hit czy GÓWNO?</span></div>'+
  '<p class="label">Wariant B · przepłacasz</p><div class="say">„Każdego grudnia przepłacasz w Pepco [X] razy więcej.”</div>'+
  '<div><span class="text-hook">Pepco [Z] zł vs Chiny [Y] zł</span></div>'+
  '<p class="label">Wariant C · jedna bombka</p><div class="say">„Te ozdoby z Chin kosztowały mniej niż jedna bombka w Pepco.”</div>'+
  '<div><span class="text-hook">Taniej niż JEDNA bombka</span></div>'+
  '<div class="note">Wariant C tylko jeśli to prawda: sprawdź cenę jednej bombki w Pepco.</div>'+
  '<p class="label">Zaraz po hooku (w każdym wariancie)</p><div class="say">„A najlepsze świeci na samym końcu.”</div></section>'+
  '<section><h2>Treść <small>każda rzecz 5–7 s</small></h2><p class="label">Przy każdej rzeczy</p><div class="scheme">'+
  '<div><span>1</span>pokazujesz z bliska</div><div><span>2</span>cena z Kako</div><div><span>3</span>ile w Pepco / Action</div><div><span>4</span>ocena x/10</div><div><span>5</span>śmieszne zdanie albo minus</div></div>'+
  '<p class="label">Kolejność, od najsłabszej do najlepszej</p><ol class="items">'+
  '<li><span class="n">1</span><span><b>Poszewki na poduszki</b></span></li>'+
  '<li><span class="n">2</span><span><b>Koc</b><em>zawiń się w niego</em></span></li>'+
  '<li><span class="n">3</span><span><b>Skrzaty pluszowe</b></span></li>'+
  '<li><span class="n">4</span><span><b>Czerwone skrzaty, 5 sztuk</b><em>postaw w rzędzie</em></span></li>'+
  '<li><span class="n">5</span><span><b>Napis LED</b><em>włącz na kamerze</em></span></li>'+
  '<li><span class="n">6</span><span><b>Lampki na USB</b><em>podłącz na kamerze</em></span></li>'+
  '<li><span class="n">7</span><span><b>Świecące skrzaty, najlepsze na koniec</b><em>zgaś światło, zapal wszystkie 5 naraz</em></span></li></ol></section>'+
  '<section><h2>Payoff <small>5–8 s</small></h2><p>Pokój przed (zwykły, zapalone światło) → cięcie → ten sam pokój cały udekorowany, ciemno, wszystko świeci.</p>'+
  '<div class="say">„Cały pokój za [Y] zł. W Pepco [Z] zł. Różnica: [Z−Y] zł.”</div><div><span class="text-hook">[Y] zł vs [Z] zł</span></div></section>'+
  '<section><h2>Koniec <small>ostatnie 3 s</small></h2><div class="say">„Linki do wszystkiego są na Discordzie, a kod JUSZKO20 masz w bio.”</div>'+
  '<p class="label">Albo pytanie do komentarzy</p><div class="say">„Co mam zamówić na Sylwestra?”</div></section>'+
  checklist('film-1',['Hook (2–3 duble)','Każda rzecz z bliska + cena (7 rzeczy)','Włączanie napisu LED','Podłączanie lampek USB','Gaszenie światła i zapalenie 5 świecących skrzatów','Pokój PRZED, z tego samego miejsca kamery','Pokój PO, wszystko świeci, z tego samego miejsca','Koniec (kod / pytanie)']);
}

function film2(){
  return '<div class="topbar"><a class="back" href="#" aria-label="Wszystkie filmy">←</a><span class="t">Film 2 z 7</span></div>'+
  '<header><h1>Najgorszy outfit z Kako</h1><div class="meta"><span class="chip red">Film 2</span><span class="chip">40–50 s</span><span class="chip">Cel: Zasięg (TOFU)</span></div></header>'+
  '<section><h2>Zanim nagrasz</h2><div class="note">Wybierz 5 najgorszych rzeczy, jakie masz z Kako (albo zamów), i zapisz cenę każdej. Muszą być prawdziwe i naprawdę słabe: krzywe logo, zły materiał, zły rozmiar, dziwny kolor.</div>'+
  '<ul class="plain glass"><li>czapka albo okulary</li><li>góra (bluza / koszulka / kurtka)</li><li>spodnie</li><li>dodatek (torba, skarpety, pasek)</li><li>buty: najgorsza rzecz, zostawiasz na koniec</li></ul></section>'+
  '<section><h2>Hook <small>0–3 s · nagraj wszystkie</small></h2>'+
  '<div class="note">We wszystkich wariantach od pierwszej sekundy stoisz już ubrany w cały outfit. Testujemy na IG jak w filmie 1.</div>'+
  '<p class="label">Wariant A · najgorszy outfit</p><div class="say">„Złożyłem najgorszy outfit, jaki da się kupić na Kako, za [X] zł. I mam go na sobie.”</div>'+
  '<div><span class="text-hook">NAJGORSZY outfit z Kako</span></div>'+
  '<p class="label">Wariant B · bezdomny</p><div class="say">„Wydałem [X] zł na Kako i wyglądam jak bezdomny.”</div>'+
  '<div><span class="text-hook">[X] zł, żeby wyglądać TAK</span></div>'+
  '<p class="label">Wariant C · dziewczyny</p><div class="say">„Dziewczyny, jeśli wasz chłopak tak się ubiera, to zamawia z Kako.”</div>'+
  '<div><span class="text-hook">Oznacz chłopaka, który tak CHODZI</span></div>'+
  '<p class="label">Wariant D · nie wyjdę z domu</p><div class="say">„Ten outfit z Kako kosztował mnie [X] zł i nie wyjdę w nim z domu.”</div>'+
  '<div><span class="text-hook">[X] zł na TO z Kako</span></div>'+
  '<p class="label">Wariant E · mama (tylko jeśli to prawda)</p><div class="say">„Moja mama zobaczyła ten outfit z Kako i kazała mi go spalić.”</div>'+
  '<div><span class="text-hook">Mama kazała to SPALIĆ</span></div>'+
  '<p class="label">Zaraz po hooku (w każdym wariancie)</p><div class="say">„A najgorsze jest na samym dole.”</div></section>'+
  '<section><h2>Treść <small>każda rzecz 6–8 s, od góry do dołu</small></h2><p class="label">Przy każdej rzeczy</p><div class="scheme">'+
  '<div><span>1</span>najgorszy detal z bliska</div><div><span>2</span>cena</div><div><span>3</span>test na kamerze</div><div><span>4</span>ocena x/10</div><div><span>5</span>śmieszne zdanie</div></div>'+
  '<p class="label">Kolejność</p><ol class="items">'+
  '<li><span class="n">1</span><span><b>Czapka albo okulary</b><em>załóż krzywo, pokaż logo</em></span></li>'+
  '<li><span class="n">2</span><span><b>Góra</b><em>rozciągnij materiał, pokaż szwy</em></span></li>'+
  '<li><span class="n">3</span><span><b>Spodnie</b><em>kucnij albo zrób przysiad</em></span></li>'+
  '<li><span class="n">4</span><span><b>Dodatek</b><em>pokaż, co jest z nim nie tak</em></span></li>'+
  '<li><span class="n">5</span><span><b>Buty, najgorsze na koniec</b><em>zegnij podeszwę, pokaż klej, powąchaj</em></span></li></ol></section>'+

function wire(){
  var box=document.querySelector('.checks'); if(!box) return;
  var KEY='juszko-'+box.getAttribute('data-key');
  var st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  var boxes=[].slice.call(box.querySelectorAll('input'));
  var c=document.querySelector('[data-count]');
  function upd(){c.textContent=boxes.filter(function(b){return b.checked}).length+'/'+boxes.length}
  boxes.forEach(function(b){b.checked=!!st[b.id];b.addEventListener('change',function(){st[b.id]=b.checked;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};upd()})});
  upd();
}

function route(){
  var id=(location.hash||'').slice(1);
  var f=FILMS.filter(function(x){return x.id===id&&x.ready})[0];
  document.getElementById('app').innerHTML=f?f.render():home();
  wire(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();

(function(){
  var WEBHOOK='https://discord.com/api/webhooks/1574923019829248011/5jegrKCbzdone_takqoLDzvTop6Q5prPqsOMD7ECudrYtVai_nhIPN8nD9IWY02pTWq_';
  var statusEl=document.getElementById('chat-status'), msgsEl=document.getElementById('msgs');
  var form=document.getElementById('compose'), ta=document.getElementById('msg-text');
  var btn=document.getElementById('send'), note=document.getElementById('send-note');
  var KEY='juszko-wyslane';
  function currentFilm(){var id=(location.hash||'').slice(1);var f=FILMS.filter(function(x){return x.id===id})[0];return f?('Film '+f.n+': '+f.title):'Ogólnie'}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(-100)))}catch(e){}}
  function fmt(t){try{return new Date(t).toLocaleString('pl-PL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
  function draw(){
    var a=load(); msgsEl.innerHTML='';
    if(!a.length){statusEl.hidden=false;statusEl.textContent='Napisz, jeśli masz pytanie albo poprawkę. Andrzej dostanie to od razu na Discordzie i odpisze Ci tam.';return}
    statusEl.hidden=false;statusEl.textContent='Andrzej odpisuje na Discordzie.';
    a.forEach(function(m){
      var w=document.createElement('div');w.className='msg mine';
      var ref=document.createElement('span');ref.className='ref';ref.textContent=m.film;
      var bb=document.createElement('div');bb.className='bubble';bb.textContent=m.text;
      var who=document.createElement('span');who.className='who';who.textContent='Wysłane · '+fmt(m.at);
      w.appendChild(ref);w.appendChild(bb);w.appendChild(who);msgsEl.appendChild(w);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  form.hidden=false; draw();
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var t=ta.value.trim(); if(!t) return;
    var film=currentFilm();
    btn.disabled=true; note.textContent='Wysyłam…';
    fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:'Juszko · strona',content:('**'+film+'**\n'+t).slice(0,1900),allowed_mentions:{parse:[]}})})
      .then(function(r){if(!r.ok) throw new Error(r.status);
        var a=load();a.push({text:t,film:film,at:Date.now()});save(a);ta.value='';note.textContent='Wysłane do Andrzeja.';draw()})
      .catch(function(){note.textContent='Nie udało się wysłać. Sprawdź internet i spróbuj jeszcze raz.'})
      .then(function(){btn.disabled=false});
  });
})();
</script>
